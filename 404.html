
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leeward Staff Portal | Page Not Found</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logos/leewaed-logo.png">
  <style>
    .error-code {
      font-size: 5.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      margin: 4px 0 12px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .t404-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-left-radius: 25px;
  border-top-left-radius: 5px;
  border-bottom-right-radius: 5px;
  border-top-right-radius: 25px;
  box-shadow: var(--shadow);
}
  </style>
</head>
<body class="auth-page">
  <div class="t404-card" style="max-width:480px; width:100%;">
    <div class="auth-card__brand">
      <div class="brand-mark">
        <div class="brand-mark__icon">
          <img src="logos/leewaed-logo.png" alt="The Leeward Group" style="width:100%; height:100%; object-fit:contain; border-radius:inherit;">
        </div>
        <div>
          <div class="brand-title">The Leeward Group</div>
          <div class="brand-subtitle">Staff Portal</div>
        </div>
      </div>
    </div>

    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Double-check the link, or head back to somewhere useful below.</p>

    <div class="popup-buttons" style="justify-content:flex-start;">
      <a href="dashboard.html" class="auth-button">Back to Dashboard</a>
      <a href="login.html" class="auth-button auth-button--secondary">Sign in</a>
    </div>

    <div class="auth-footer">
      <p class="auth-inline-copy">Think this is a bug? <a class="auth-link">Contact the IT Department</a>.</p>
    </div>
  </div>
</body>
</html>
